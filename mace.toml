[input]
# NOTE: Set this to your own legally-obtained ROM file.
rom_file_path = "roms/Mace - The Dark Age (USA).z64"
symbols_file_path = "config/symbols.toml"
output_func_path = "generated/functions"
output_binary_path = "generated/mace_code.bin"
entrypoint = 0x80000400
uses_mips3_float_mode = true
functions_per_output_file = 50
trace_mode = false

[patches]
ignored = []
stubs = []

# The trampoline at 0x8006BF64 is a normal function and is recompiled.

# Route game's custom threading through the runtime scheduler
# Custom thread init -> mace_thread_init_shim (translates args, calls osCreateThread)
[[patches.hook]]
func = "func_80073880"
before_vram = 0x80073880
text = "mace_thread_init_shim(rdram, ctx); return;"

# Custom thread start -> mace_thread_start_shim (calls osStartThread)
[[patches.hook]]
func = "func_800739d0"
before_vram = 0x800739D0
text = "mace_thread_start_shim(rdram, ctx); return;"

# VI handler -> pause_self (yield to scheduler)
[[patches.hook]]
func = "func_80075f20"
before_vram = 0x80075F20
text = "pause_self(rdram); return;"
